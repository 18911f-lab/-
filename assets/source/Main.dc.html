<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>プレイ画面</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#120e2b;font-family:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#ffffff">

  <!-- 背景：渋谷の夜（ドット絵風） -->
  <svg viewBox="0 0 130 281" preserveAspectRatio="none" shape-rendering="crispEdges" style="position:absolute;left:0;top:0;width:390px;height:844px" aria-hidden="true">
    <defs>
      <pattern id="winB" width="6" height="8" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="2" height="3" fill="#f2c14e" opacity="0.55"/></pattern>
      <pattern id="winF" width="6" height="8" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="2" height="3" fill="#ffb454" opacity="0.85"/></pattern>
      <pattern id="brick" width="18" height="18" patternUnits="userSpaceOnUse">
        <rect x="0" y="17" width="18" height="1" fill="#2a2446"/>
        <rect x="0" y="0" width="1" height="9" fill="#2a2446"/>
        <rect x="9" y="9" width="1" height="9" fill="#2a2446"/>
      </pattern>
      <g id="pile">
        <rect x="-1" y="189" width="13" height="15" fill="#0a0818"/>
        <rect x="0" y="190" width="11" height="13" fill="#44577d"/>
        <rect x="1" y="191" width="2" height="5" fill="#6b83b3"/>
        <rect x="4" y="187" width="3" height="3" fill="#0a0818"/>
        <rect x="5" y="188" width="1" height="2" fill="#44577d"/>
        <rect x="9" y="194" width="12" height="11" fill="#0a0818"/>
        <rect x="10" y="195" width="10" height="9" fill="#36456a"/>
        <rect x="11" y="196" width="2" height="3" fill="#566d9c"/>
        <rect x="2" y="180" width="10" height="11" fill="#0a0818"/>
        <rect x="3" y="181" width="8" height="9" fill="#5a6fa0"/>
        <rect x="4" y="182" width="2" height="3" fill="#8aa0cf"/>
        <rect x="5" y="177" width="4" height="4" fill="#0a0818"/>
        <rect x="6" y="178" width="2" height="2" fill="#5a6fa0"/>
      </g>
    </defs>

    <!-- 空 -->
    <rect x="0" y="0" width="130" height="40" fill="#120e2b"/>
    <rect x="0" y="40" width="130" height="30" fill="#1b1240"/>
    <rect x="0" y="70" width="130" height="25" fill="#2a1750"/>
    <rect x="0" y="95" width="130" height="20" fill="#44205e"/>
    <rect x="0" y="115" width="130" height="20" fill="#6e2a66"/>
    <rect x="0" y="135" width="130" height="15" fill="#a33f67"/>
    <rect x="0" y="150" width="130" height="18" fill="#d65a58"/>
    <!-- 星 -->
    <g fill="#ffffff" opacity="0.8">
      <rect x="8" y="10" width="1" height="1"/><rect x="22" y="6" width="1" height="1"/><rect x="36" y="18" width="1" height="1"/>
      <rect x="50" y="8" width="1" height="1"/><rect x="64" y="26" width="1" height="1"/><rect x="78" y="12" width="1" height="1"/>
      <rect x="90" y="32" width="1" height="1"/><rect x="14" y="34" width="1" height="1"/><rect x="44" y="38" width="1" height="1"/>
      <rect x="120" y="8" width="1" height="1"/><rect x="30" y="52" width="1" height="1"/><rect x="70" y="50" width="1" height="1"/>
      <rect x="96" y="58" width="1" height="1"/><rect x="56" y="62" width="1" height="1"/>
    </g>
    <!-- 月 -->
    <rect x="101" y="12" width="16" height="16" fill="#fff3c4" opacity="0.06"/>
    <g fill="#fff3c4">
      <rect x="106" y="15" width="6" height="1"/><rect x="104" y="16" width="10" height="1"/>
      <rect x="103" y="17" width="12" height="6"/><rect x="104" y="23" width="10" height="1"/><rect x="106" y="24" width="6" height="1"/>
    </g>
    <rect x="106" y="18" width="2" height="2" fill="#e7d9a1"/><rect x="111" y="21" width="2" height="2" fill="#e7d9a1"/>

    <!-- 奥のビル -->
    <g fill="#1f1646">
      <rect x="0" y="88" width="24" height="80"/><rect x="18" y="72" width="18" height="96"/><rect x="36" y="96" width="24" height="72"/>
      <rect x="60" y="72" width="18" height="96"/><rect x="78" y="88" width="24" height="80"/><rect x="102" y="80" width="30" height="88"/>
    </g>
    <g fill="url(#winB)">
      <rect x="0" y="88" width="24" height="80"/><rect x="18" y="72" width="18" height="96"/><rect x="36" y="96" width="24" height="72"/>
      <rect x="60" y="72" width="18" height="96"/><rect x="78" y="88" width="24" height="80"/><rect x="102" y="80" width="30" height="88"/>
    </g>
    <g fill="#1f1646">
      <rect x="6" y="96" width="6" height="8"/><rect x="12" y="120" width="6" height="8"/><rect x="24" y="80" width="6" height="8"/>
      <rect x="30" y="104" width="6" height="8"/><rect x="42" y="104" width="6" height="8"/><rect x="48" y="112" width="6" height="8"/>
      <rect x="66" y="88" width="6" height="8"/><rect x="60" y="104" width="6" height="8"/><rect x="84" y="96" width="6" height="8"/>
      <rect x="90" y="104" width="6" height="8"/><rect x="108" y="96" width="6" height="8"/><rect x="114" y="104" width="6" height="8"/>
      <rect x="120" y="88" width="6" height="8"/>
    </g>
    <!-- 看板（屋上） -->
    <rect x="108" y="74" width="1" height="6" fill="#0a0818"/><rect x="124" y="74" width="1" height="6" fill="#0a0818"/>
    <rect x="102" y="62" width="30" height="15" fill="#ffd36b" opacity="0.14"/>
    <rect x="104" y="64" width="26" height="11" fill="#ffd36b"/>
    <rect x="105" y="65" width="24" height="9" fill="#2a1250"/>
    <text x="117" y="72" text-anchor="middle" font-size="4.2" fill="#ffd36b" font-family="DotGothic16, sans-serif">SHIBUYA</text>

    <!-- 手前のビル -->
    <g fill="#2e1f5c">
      <rect x="0" y="112" width="24" height="56"/><rect x="24" y="104" width="18" height="64"/><rect x="42" y="128" width="30" height="40"/>
      <rect x="72" y="112" width="24" height="56"/><rect x="96" y="120" width="18" height="48"/><rect x="114" y="104" width="18" height="64"/>
    </g>
    <g fill="url(#winF)">
      <rect x="0" y="112" width="24" height="56"/><rect x="24" y="104" width="18" height="64"/><rect x="42" y="128" width="30" height="40"/>
      <rect x="72" y="112" width="24" height="56"/><rect x="96" y="120" width="18" height="48"/><rect x="114" y="104" width="18" height="64"/>
    </g>
    <g fill="#2e1f5c">
      <rect x="6" y="128" width="6" height="8"/><rect x="12" y="144" width="6" height="8"/><rect x="30" y="112" width="6" height="8"/>
      <rect x="24" y="136" width="6" height="8"/><rect x="36" y="152" width="6" height="8"/><rect x="54" y="144" width="6" height="8"/>
      <rect x="66" y="152" width="6" height="8"/><rect x="78" y="136" width="6" height="8"/><rect x="90" y="144" width="6" height="8"/>
      <rect x="102" y="128" width="6" height="8"/><rect x="108" y="152" width="6" height="8"/><rect x="120" y="136" width="6" height="8"/>
    </g>
    <!-- ネオン看板 -->
    <rect x="44" y="131" width="26" height="13" fill="#ff3d8b" opacity="0.22"/>
    <rect x="46" y="134" width="22" height="8" fill="#ff3d8b"/><rect x="47" y="135" width="20" height="6" fill="#2a0a28"/>
    <text x="57" y="140.2" text-anchor="middle" font-size="5" fill="#ff8fc0" font-family="DotGothic16, sans-serif">ラーメン</text>
    <rect x="76" y="116" width="16" height="11" fill="#6dff9b" opacity="0.2"/>
    <rect x="78" y="118" width="12" height="7" fill="#6dff9b"/><rect x="79" y="119" width="10" height="5" fill="#06281a"/>
    <text x="84" y="123.3" text-anchor="middle" font-size="4.2" fill="#6dff9b" font-family="DotGothic16, sans-serif">24H</text>
    <rect x="114" y="110" width="16" height="11" fill="#3ff0ff" opacity="0.2"/>
    <rect x="116" y="112" width="14" height="7" fill="#3ff0ff"/><rect x="117" y="113" width="12" height="5" fill="#06242a"/>
    <text x="123" y="117.3" text-anchor="middle" font-size="3.8" fill="#3ff0ff" font-family="DotGothic16, sans-serif">SALE</text>

    <!-- 道路・横断歩道 -->
    <rect x="0" y="168" width="130" height="37" fill="#181330"/>
    <g fill="#2c2650">
      <rect x="2" y="172" width="6" height="28"/><rect x="14" y="172" width="6" height="28"/><rect x="26" y="172" width="6" height="28"/>
      <rect x="38" y="172" width="6" height="28"/><rect x="50" y="172" width="6" height="28"/><rect x="62" y="172" width="6" height="28"/>
      <rect x="74" y="172" width="6" height="28"/><rect x="86" y="172" width="6" height="28"/><rect x="98" y="172" width="6" height="28"/>
      <rect x="110" y="172" width="6" height="28"/><rect x="122" y="172" width="6" height="28"/>
    </g>
    <!-- 路上のゴミ -->
    <rect x="30" y="192" width="2" height="2" fill="#e0394a"/><rect x="96" y="196" width="2" height="2" fill="#25b368"/>
    <rect x="50" y="186" width="2" height="2" fill="#cfd6e4"/><rect x="82" y="190" width="2" height="2" fill="#f59e0b"/>
    <!-- ゴミ山 -->
    <use href="#pile"/>
    <use href="#pile" transform="translate(130 0) scale(-1 1)"/>

    <!-- 歩道 -->
    <rect x="0" y="203" width="130" height="3" fill="#5b5380"/>
    <rect x="0" y="206" width="130" height="75" fill="#342d55"/>
    <rect x="0" y="206" width="130" height="75" fill="url(#brick)"/>
  </svg>

  <!-- 前面UI -->
  <div style="position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;padding:16px 16px 28px 16px;box-sizing:border-box">

    <!-- ヘッダー -->
    <div style="display:flex;justify-content:space-between;align-items:center;height:40px">
      <div style="font-size:17px;color:#8fe3ff;text-shadow:2px 2px 0 #000000">渋谷ゴミ分別TA</div>
      <div style="display:flex;gap:12px;margin-right:3px">
        <button type="button" aria-label="サウンド" style="width:36px;height:36px;padding:0;border:0;background:#241a4a;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 -3px 0 0 #8b7fd0,0 3px 0 0 #8b7fd0,-3px 0 0 0 #8b7fd0,3px 0 0 0 #8b7fd0">
          <svg width="20" height="20" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><g fill="#ffffff"><rect x="1" y="3" width="2" height="4"/><rect x="3" y="2" width="2" height="6"/><rect x="6" y="4" width="1" height="2"/><rect x="8" y="3" width="1" height="4"/></g></svg>
        </button>
        <button type="button" aria-label="あそびかた" style="width:36px;height:36px;padding:0;border:0;background:#241a4a;color:#ffd36b;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 -3px 0 0 #8b7fd0,0 3px 0 0 #8b7fd0,-3px 0 0 0 #8b7fd0,3px 0 0 0 #8b7fd0">?</button>
      </div>
    </div>

    <!-- ライフ・スコア -->
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;height:46px">
      <div style="display:flex;gap:6px" aria-label="ライフ 3">
        <svg width="36" height="32" viewBox="0 0 9 8" shape-rendering="crispEdges" aria-hidden="true"><g fill="#ff4d6d"><rect x="1" y="0" width="3" height="1"/><rect x="5" y="0" width="3" height="1"/><rect x="0" y="1" width="9" height="2"/><rect x="1" y="3" width="7" height="1"/><rect x="2" y="4" width="5" height="1"/><rect x="3" y="5" width="3" height="1"/><rect x="4" y="6" width="1" height="1"/></g><rect x="1" y="1" width="1" height="1" fill="#ffc2cf"/></svg>
        <svg width="36" height="32" viewBox="0 0 9 8" shape-rendering="crispEdges" aria-hidden="true"><g fill="#ff4d6d"><rect x="1" y="0" width="3" height="1"/><rect x="5" y="0" width="3" height="1"/><rect x="0" y="1" width="9" height="2"/><rect x="1" y="3" width="7" height="1"/><rect x="2" y="4" width="5" height="1"/><rect x="3" y="5" width="3" height="1"/><rect x="4" y="6" width="1" height="1"/></g><rect x="1" y="1" width="1" height="1" fill="#ffc2cf"/></svg>
        <svg width="36" height="32" viewBox="0 0 9 8" shape-rendering="crispEdges" aria-hidden="true"><g fill="#ff4d6d"><rect x="1" y="0" width="3" height="1"/><rect x="5" y="0" width="3" height="1"/><rect x="0" y="1" width="9" height="2"/><rect x="1" y="3" width="7" height="1"/><rect x="2" y="4" width="5" height="1"/><rect x="3" y="5" width="3" height="1"/><rect x="4" y="6" width="1" height="1"/></g><rect x="1" y="1" width="1" height="1" fill="#ffc2cf"/></svg>
      </div>
      <div style="text-align:right;margin-right:3px">
        <div style="font-size:11px;color:#c9bff0;letter-spacing:2px">SCORE</div>
        <div style="font-size:38px;line-height:1;color:#ffd36b;text-shadow:3px 3px 0 #000000">300</div>
      </div>
    </div>

    <!-- タイマー -->
    <div style="display:flex;gap:3px;margin-top:12px;height:14px" aria-label="残り時間">
      <sc-for list="{{blocks}}" as="block" hint-placeholder-count="20">
        <div style="flex:1;height:14px;background:{{block.bg}}"></div>
      </sc-for>
    </div>

    <!-- お題ゴミ -->
    <div style="flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="position:relative;width:200px;height:200px;margin-bottom:-10px">
        <svg viewBox="0 0 25 25" shape-rendering="crispEdges" style="position:absolute;left:0;top:0;width:200px;height:200px" aria-hidden="true">
          <g fill="#ffd36b" opacity="0.07"><rect x="3" y="1" width="19" height="23"/><rect x="1" y="3" width="23" height="19"/></g>
          <g fill="#ffd36b" opacity="0.09"><rect x="5" y="3" width="15" height="19"/><rect x="3" y="5" width="19" height="15"/></g>
          <g fill="#ffd36b" opacity="0.12"><rect x="7" y="5" width="11" height="15"/><rect x="5" y="7" width="15" height="11"/></g>
        </svg>
        <div style="position:absolute;left:28px;top:28px;width:144px;height:144px;animation:bob 1.2s steps(2) infinite">
          <svg width="144" height="144" viewBox="0 0 24 24" shape-rendering="crispEdges" role="img" aria-label="写真フィルム（ネガ）">
            <rect x="1" y="3" width="22" height="18" fill="#0a0818"/>
            <rect x="2" y="4" width="20" height="16" fill="#3b2f6e"/>
            <g fill="#e9e4ff"><rect x="4" y="5" width="2" height="2"/><rect x="8" y="5" width="2" height="2"/><rect x="12" y="5" width="2" height="2"/><rect x="16" y="5" width="2" height="2"/><rect x="19" y="5" width="2" height="2"/>
            <rect x="4" y="17" width="2" height="2"/><rect x="8" y="17" width="2" height="2"/><rect x="12" y="17" width="2" height="2"/><rect x="16" y="17" width="2" height="2"/><rect x="19" y="17" width="2" height="2"/></g>
            <rect x="4" y="8" width="16" height="8" fill="#7dd3fc"/>
            <rect x="5" y="9" width="6" height="2" fill="#bae6fd"/>
            <rect x="14" y="13" width="5" height="2" fill="#38a8e0"/>
          </svg>
        </div>
      </div>
      <div style="background:#120e2b;padding:10px 18px;font-size:22px;color:#ffffff;box-shadow:0 -3px 0 0 #d7ccff,0 3px 0 0 #d7ccff,-3px 0 0 0 #d7ccff,3px 0 0 0 #d7ccff">写真フィルム（ネガ）</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:16px">
        <div style="background:#ffd36b;color:#3a1c00;padding:3px 10px;font-size:13px;box-shadow:0 -2px 0 0 #ffd36b,0 2px 0 0 #ffd36b,-2px 0 0 0 #ffd36b,2px 0 0 0 #ffd36b">通常状態</div>
        <div style="font-size:11px;color:#c9bff0;letter-spacing:1px">TIER 1 / 100PT</div>
      </div>

      <sc-if value="{{showCombo}}" hint-placeholder-val="{{true}}">
        <div style="position:absolute;right:2px;top:46px;transform:rotate(-8deg);font-size:24px;color:#ffd36b;text-shadow:2px 2px 0 #7c1d3a,-2px 2px 0 #7c1d3a,2px -2px 0 #7c1d3a,-2px -2px 0 #7c1d3a,0 5px 0 #3a0d1c">{{comboText}}</div>
      </sc-if>
      <div style="position:absolute;left:8px;top:96px;transform:rotate(6deg);font-size:20px;color:#6dff9b;text-shadow:2px 2px 0 #000000">+100</div>
    </div>

    <!-- ゴミ箱（画面内の物体） -->
    <div style="display:flex;justify-content:space-between;padding:0 2px">

      <button type="button" aria-label="可燃ごみ（Qキー）" style="position:relative;width:84px;padding:0;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:#ffffff">
        <div style="position:absolute;left:0;top:0;background:#120e2b;padding:1px 6px;font-size:11px;box-shadow:0 -2px 0 0 #d7ccff,0 2px 0 0 #d7ccff,-2px 0 0 0 #d7ccff,2px 0 0 0 #d7ccff">Q</div>
        <svg width="80" height="112" viewBox="0 0 20 28" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="7" y="0" width="6" height="3" fill="#0a0818"/><rect x="1" y="2" width="18" height="4" fill="#0a0818"/><rect x="2" y="5" width="16" height="22" fill="#0a0818"/>
          <rect x="3" y="26" width="5" height="2" fill="#0a0818"/><rect x="12" y="26" width="5" height="2" fill="#0a0818"/>
          <rect x="8" y="1" width="4" height="1" fill="#8a93a6"/>
          <rect x="2" y="3" width="16" height="2" fill="#c9d0df"/><rect x="2" y="5" width="16" height="1" fill="#7f89a0"/>
          <rect x="3" y="6" width="14" height="20" fill="#aab3c5"/><rect x="3" y="6" width="2" height="20" fill="#cfd6e4"/><rect x="15" y="6" width="2" height="20" fill="#8a93a6"/>
          <rect x="3" y="9" width="14" height="1" fill="#8a93a6"/><rect x="3" y="22" width="14" height="1" fill="#8a93a6"/>
          <rect x="5" y="11" width="10" height="7" fill="#e0394a"/>
          <g fill="#ffffff"><rect x="10" y="12" width="1" height="1"/><rect x="9" y="13" width="3" height="2"/><rect x="8" y="15" width="5" height="2"/></g>
          <rect x="4" y="26" width="3" height="1" fill="#4a5166"/><rect x="13" y="26" width="3" height="1" fill="#4a5166"/>
        </svg>
        <div style="background:#120e2b;padding:4px 8px;font-size:14px;box-shadow:0 -3px 0 0 #ff5d73,0 3px 0 0 #ff5d73,-3px 0 0 0 #ff5d73,3px 0 0 0 #ff5d73">可燃ごみ</div>
      </button>

      <button type="button" aria-label="不燃ごみ（Wキー）" style="position:relative;width:84px;padding:0;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:#ffffff">
        <div style="position:absolute;left:0;top:0;background:#120e2b;padding:1px 6px;font-size:11px;box-shadow:0 -2px 0 0 #d7ccff,0 2px 0 0 #d7ccff,-2px 0 0 0 #d7ccff,2px 0 0 0 #d7ccff">W</div>
        <svg width="80" height="112" viewBox="0 0 20 28" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="7" y="0" width="6" height="3" fill="#0a0818"/><rect x="1" y="2" width="18" height="4" fill="#0a0818"/><rect x="2" y="5" width="16" height="22" fill="#0a0818"/>
          <rect x="3" y="26" width="5" height="2" fill="#0a0818"/><rect x="12" y="26" width="5" height="2" fill="#0a0818"/>
          <rect x="8" y="1" width="4" height="1" fill="#8a93a6"/>
          <rect x="2" y="3" width="16" height="2" fill="#c9d0df"/><rect x="2" y="5" width="16" height="1" fill="#7f89a0"/>
          <rect x="3" y="6" width="14" height="20" fill="#aab3c5"/><rect x="3" y="6" width="2" height="20" fill="#cfd6e4"/><rect x="15" y="6" width="2" height="20" fill="#8a93a6"/>
          <rect x="3" y="9" width="14" height="1" fill="#8a93a6"/><rect x="3" y="22" width="14" height="1" fill="#8a93a6"/>
          <rect x="5" y="11" width="10" height="7" fill="#2f7df0"/>
